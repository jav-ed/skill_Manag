[package]
name = "skillmirror-core"
description = "Engine of skillmirror: vault, project scan, plan and apply. No terminal, no async."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
etcetera = "0.11"
fs-err = "3"
ignore = "0.4"
rayon = "1"
rustix = { version = "1", features = ["fs"] }
serde = { version = "1", features = ["derive"] }
serde-saphyr = "1.3"
serde_json = "1"
tempfile = "3"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
